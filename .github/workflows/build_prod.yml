name: Build/Publish Docker Image PROD

on:
  push:
    branches:
      - prod

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: checkout de codigo
        uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: build da imagem de treino
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.train
          tags: docker-ml-projeto-train
          load: true
          cache-from: type=gha,scope=train
          cache-to: type=gha,scope=train,mode=max

      - name: build da imagem de inferencia
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.inference
          tags: docker-ml-projeto-inference
          load: true
          cache-from: type=gha,scope=inference
          cache-to: type=gha,scope=inference,mode=max


  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: prod
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout de codigo
        uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: login no github container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: definir nome do proprietario em minusculas
        id: registry
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "OWNER=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: publish da imagem de treino
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.train
          platforms: linux/arm64,linux/amd64
          tags: ghcr.io/${{ steps.registry.outputs.OWNER }}/docker-ml-projeto-train:latest
          push: true
          cache-from: type=gha,scope=train
          cache-to: type=gha,scope=train,mode=max

      - name: publish da imagem de inferencia
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.inference
          platforms: linux/arm64,linux/amd64
          tags: ghcr.io/${{ steps.registry.outputs.OWNER }}/docker-ml-projeto-inference:latest
          push: true
          cache-from: type=gha,scope=inference
          cache-to: type=gha,scope=inference,mode=max