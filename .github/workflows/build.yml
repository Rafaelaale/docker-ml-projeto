# passo 01:
# atribuindo nome ao workflow

name: Build Docker Image

# passo 02:
# definir o trigger para o workflow

on:
  push:
    branches:
      - modulo07

# passo 03:
# definir os jobs do workflow

jobs:
  # definimos o primeiro job, o job de build
  build:
    # precisamos definir o ambiente em que os jobs serão executados, nesse caso
    # usaremos o ubuntu-latest
    runs-on: ubuntu-latest

    # para verificarmos as actions e versoes
    # https://github.com/marketplace?type=actions
    # definir o steps do job
    steps:
      # o primeiro step é o checkout do código
      - name: checkout de codigo
        uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # o passo seguinte ser ao build do codigo
      - name: build da imagem de treino
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.train
          tags: docker-ml-projeto-train
          load: true
          cache-from: type=gha,scope=train
          cache-to: type=gha,scope=train,mode=max

      - name: build da imagem de inferencia
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.inference
          tags: docker-ml-projeto-inference
          load: true
          cache-from: type=gha,scope=inference
          cache-to: type=gha,scope=inference,mode=max
  
  validacao:
    # o job de valicao depende do job de build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: checkout de codigo
        uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # rebuild do treino
      - name: rebuild da imagem de treino
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.train
          tags: docker-ml-projeto-train
          load: true
          cache-from: type=gha,scope=train
          cache-to: type=gha,scope=train,mode=max

      # rebuild da inferencia
      - name: rebuild da imagem de inferencia
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.inference
          tags: docker-ml-projeto-inference
          load: true
          cache-from: type=gha,scope=inference
          cache-to: type=gha,scope=inference,mode=max

      # armazenar o artefato do build da imagem de treino no runner
      - name: validacao de treino
        run: docker run -v ${{ github.workspace }}/artifacts:/app/artifacts docker-ml-projeto-train
      
      # verificar se de fato o artefato foi criado
      - name: validacao de inferencia
        run: docker run -v "$GITHUB_WORKSPACE/artifacts:/app/artifacts" docker-ml-projeto-inference python -m src.inference --efficiency 300

  publish:
    runs-on: ubuntu-latest
    needs: validacao
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout de codigo
        uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: definir registro e nome das imagens
        id: registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_PASSWORD" ]]; then
            echo "registry=docker.io" >> "$GITHUB_OUTPUT"
            echo "username=${DOCKERHUB_USERNAME,,}" >> "$GITHUB_OUTPUT"
            echo "image_prefix=${DOCKERHUB_USERNAME,,}/docker-ml-projeto" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Docker Hub credentials missing; publishing to GHCR instead."
            echo "registry=ghcr.io" >> "$GITHUB_OUTPUT"
            echo "username=$GITHUB_ACTOR" >> "$GITHUB_OUTPUT"
            echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          fi

      - name: login no registro
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.registry.outputs.registry }}
          username: ${{ steps.registry.outputs.username }}
          password: ${{ steps.registry.outputs.registry == 'docker.io' && (secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD) || github.token }}

      - name: definir versao da imagem
        id: versioning
        run: echo "VERSION=${GITHUB_RUN_NUMBER}.0.0" >> "$GITHUB_OUTPUT"
      
      - name: publish da imagem de treino
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.train
          platforms: linux/arm64,linux/amd64
          tags: ${{ steps.registry.outputs.image_prefix }}-train:${{ steps.versioning.outputs.VERSION }}
          push: true
          cache-from: type=gha,scope=train
          cache-to: type=gha,scope=train,mode=max

      - name: publish da imagem de inferencia
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.inference
          platforms: linux/arm64,linux/amd64
          tags: ${{ steps.registry.outputs.image_prefix }}-inference:${{ steps.versioning.outputs.VERSION }}
          push: true
          cache-from: type=gha,scope=inference
          cache-to: type=gha,scope=inference,mode=max

  smoke-test:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      packages: read

    steps:
      - name: definir registro e nome das imagens
        id: registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_PASSWORD" ]]; then
            echo "registry=docker.io" >> "$GITHUB_OUTPUT"
            echo "username=${DOCKERHUB_USERNAME,,}" >> "$GITHUB_OUTPUT"
            echo "image_prefix=${DOCKERHUB_USERNAME,,}/docker-ml-projeto" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Docker Hub credentials missing; using GHCR instead."
            echo "registry=ghcr.io" >> "$GITHUB_OUTPUT"
            echo "username=$GITHUB_ACTOR" >> "$GITHUB_OUTPUT"
            echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          fi

      - name: login no registro
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.registry.outputs.registry }}
          username: ${{ steps.registry.outputs.username }}
          password: ${{ steps.registry.outputs.registry == 'docker.io' && (secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD) || github.token }}
      
      - name: definir versao da imagem
        id: versioning
        run: echo "VERSION=${GITHUB_RUN_NUMBER}.0.0" >> "$GITHUB_OUTPUT"

      - name: definir imagens para smoke test
        env:
          IMAGE_PREFIX: ${{ steps.registry.outputs.image_prefix }}
          VERSION: ${{ steps.versioning.outputs.VERSION }}
        run: |
          echo "TRAIN_IMAGE=${IMAGE_PREFIX}-train:${VERSION}" >> "$GITHUB_ENV"
          echo "INFERENCE_IMAGE=${IMAGE_PREFIX}-inference:${VERSION}" >> "$GITHUB_ENV"
      
      # validar a imagem de treino
      - name: smoke test da imagem de treino
        run: docker pull "$TRAIN_IMAGE"

      # verificar se o container de treino roda
      - name: execucao da imagem de treino
        run: docker run -v "$GITHUB_WORKSPACE/artifacts:/app/artifacts" "$TRAIN_IMAGE"

      # validar a imagem de inferencia
      - name: smoke test da imagem de inferencia
        run: docker pull "$INFERENCE_IMAGE"

      # executar a imagem de inferencia
      - name: execucao da imagem de inferencia
        run: docker run -v "$GITHUB_WORKSPACE/artifacts:/app/artifacts" "$INFERENCE_IMAGE" python -m src.inference --efficiency 300