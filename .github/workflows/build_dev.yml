# esse é o pipeline de build e publish de dev
name: Build/Publish Docker Image DEV

on:
  push:
    branches:
      - dev


jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev

    # para verificarmos as actions e versoes
    # https://github.com/marketplace?type=actions
    # definir o steps do job
    steps:
      # o primeiro step é o checkout do código
      - name: checkout de codigo
        uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # o passo seguinte ser ao build do codigo
      - name: build da imagem de treino
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.train
          tags: docker-ml-projeto-train
          load: true
          cache-from: type=gha,scope=train
          cache-to: type=gha,scope=train,mode=max

      - name: build da imagem de inferencia
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.inference
          tags: docker-ml-projeto-inference
          load: true
          cache-from: type=gha,scope=inference
          cache-to: type=gha,scope=inference,mode=max

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout de codigo
        uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: login no github container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: definir namespace em minusculas
        id: namespace
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: definir versao da imagem
        id: versioning
        run: echo "VERSION=dev-${{ github.run_number }}.0.0" >> $GITHUB_OUTPUT
      
      - name: publish da imagem de treino
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.train
          platforms: linux/arm64,linux/amd64
          tags: ghcr.io/${{ steps.namespace.outputs.OWNER }}/docker-ml-projeto-train:${{ steps.versioning.outputs.VERSION }}
          push: true
          cache-from: type=gha,scope=train
          cache-to: type=gha,scope=train,mode=max

      - name: publish da imagem de inferencia
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.inference
          platforms: linux/arm64,linux/amd64
          tags: ghcr.io/${{ steps.namespace.outputs.OWNER }}/docker-ml-projeto-inference:${{ steps.versioning.outputs.VERSION }}
          push: true
          cache-from: type=gha,scope=inference
          cache-to: type=gha,scope=inference,mode=max