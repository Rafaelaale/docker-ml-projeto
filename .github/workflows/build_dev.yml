# esse é o pipeline de build e publish de dev
name: Build/Publish Docker Image DEV

on:
  push:
    branches:
      - dev


jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev

    # para verificarmos as actions e versoes
    # https://github.com/marketplace?type=actions
    # definir o steps do job
    steps:
      # o primeiro step é o checkout do código
      - name: checkout de codigo
        uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # o passo seguinte ser ao build do codigo
      - name: build da imagem de treino
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.train
          tags: docker-ml-projeto-train
          load: true
          cache-from: type=gha,scope=train
          cache-to: type=gha,scope=train,mode=max

      - name: build da imagem de inferencia
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.inference
          tags: docker-ml-projeto-inference
          load: true
          cache-from: type=gha,scope=inference
          cache-to: type=gha,scope=inference,mode=max

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: dev

    steps:
      - name: validar credenciais do docker hub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_PASSWORD" ]]; then
            echo "::error::Configure DOCKERHUB_USERNAME and DOCKERHUB_PASSWORD in repository secrets or the dev environment secrets. Use a Docker Hub access token with write permission as DOCKERHUB_PASSWORD."
            exit 1
          fi

      - name: checkout de codigo
        uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: login no docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: definir versao da imagem
        id: versioning
        run: echo "VERSION=dev-${{ github.run_number }}.0.0" >> $GITHUB_OUTPUT
      
      - name: publish da imagem de treino
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.train
          platforms: linux/arm64,linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/docker-ml-projeto-train:${{ steps.versioning.outputs.VERSION }}
          push: true
          cache-from: type=gha,scope=train
          cache-to: type=gha,scope=train,mode=max

      - name: publish da imagem de inferencia
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.inference
          platforms: linux/arm64,linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/docker-ml-projeto-inference:${{ steps.versioning.outputs.VERSION }}
          push: true
          cache-from: type=gha,scope=inference
          cache-to: type=gha,scope=inference,mode=max