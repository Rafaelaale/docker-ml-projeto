# esse é o pipeline de build e publish de dev
name: Build/Publish Docker Image DEV

on:
  push:
    branches:
      - dev


jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev

    # para verificarmos as actions e versoes
    # https://github.com/marketplace?type=actions
    # definir o steps do job
    steps:
      # o primeiro step é o checkout do código
      - name: checkout de codigo
        uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # o passo seguinte ser ao build do codigo
      - name: build da imagem de treino
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.train
          tags: docker-ml-projeto-train
          load: true
          cache-from: type=gha,scope=train
          cache-to: type=gha,scope=train,mode=max

      - name: build da imagem de inferencia
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.inference
          tags: docker-ml-projeto-inference
          load: true
          cache-from: type=gha,scope=inference
          cache-to: type=gha,scope=inference,mode=max

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout de codigo
        uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: definir registro e nome das imagens
        id: registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_PASSWORD" ]]; then
            echo "registry=docker.io" >> "$GITHUB_OUTPUT"
            echo "username=${DOCKERHUB_USERNAME,,}" >> "$GITHUB_OUTPUT"
            echo "image_prefix=${DOCKERHUB_USERNAME,,}/docker-ml-projeto" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Docker Hub credentials missing; publishing to GHCR instead."
            echo "registry=ghcr.io" >> "$GITHUB_OUTPUT"
            echo "username=$GITHUB_ACTOR" >> "$GITHUB_OUTPUT"
            echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          fi

      - name: login no registro
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.registry.outputs.registry }}
          username: ${{ steps.registry.outputs.username }}
          password: ${{ steps.registry.outputs.registry == 'docker.io' && (secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD) || github.token }}

      - name: definir versao da imagem
        id: versioning
        run: echo "VERSION=dev-${GITHUB_RUN_NUMBER}.0.0" >> "$GITHUB_OUTPUT"
      
      - name: publish da imagem de treino
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.train
          platforms: linux/arm64,linux/amd64
          tags: ${{ steps.registry.outputs.image_prefix }}-train:${{ steps.versioning.outputs.VERSION }}
          push: true
          cache-from: type=gha,scope=train
          cache-to: type=gha,scope=train,mode=max

      - name: publish da imagem de inferencia
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.inference
          platforms: linux/arm64,linux/amd64
          tags: ${{ steps.registry.outputs.image_prefix }}-inference:${{ steps.versioning.outputs.VERSION }}
          push: true
          cache-from: type=gha,scope=inference
          cache-to: type=gha,scope=inference,mode=max